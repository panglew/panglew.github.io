<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ About }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-mode">
    <header>
        <nav>
            <div class="container">
                <p style="display: flex; align-items:center">
                    <a href="/"> Home Page </a>
                </p>
                <p>
                    <a href="/classes/"> Classes & Projects </a> |
                    <a href="/fragrances/"> Fragrances </a>
                </p>
            </div>
            <hr>
        </nav>
    </header>

    <main>
        <h1>{{ page_title }}</h1>
        <p>{{ about_text }}</p>

        {% if is_admin %}
        <hr>
        <h2>Edit About Page</h2>
        <form action="{{ url_for('show_about') }}" method="post">
            <label for="page_title">Page Title:</label>
            <input type="text" id="page_title" name="page_title" value="{{ page_title }}" required><br><br>

            <label for="about_text">About Text:</label>
            <textarea id="about_text" name="about_text" rows="10" required>{{ about_text }}</textarea><br><br>

            <input type="submit" value="Save">
        </form>
        {% endif %}
    </main>

</body>
</html>
